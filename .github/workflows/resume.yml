name: Build Resume PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: resume-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-resume.txt

      - name: Install PDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libharfbuzz-subset0 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            poppler-utils

      - name: Install PDF Python dependencies
        run: python -m pip install --requirement requirements-resume.txt

      - name: Validate canonical resume data
        run: python scripts/validate_resume.py

      - name: Generate tagged PDF/UA-1 resume
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          mkdir -p _site/assets
          python -m weasyprint \
            --pdf-variant pdf/ua-1 \
            _site/resume-pdf.html \
            _site/assets/Dipak-Boyed-Resume.pdf

      - name: Validate ATS extraction and PDF structure
        run: |
          pdftotext _site/assets/Dipak-Boyed-Resume.pdf artifacts-resume.txt
          pdftotext -layout _site/assets/Dipak-Boyed-Resume.pdf artifacts-resume-layout.txt
          python scripts/validate_resume.py \
            --pdf _site/assets/Dipak-Boyed-Resume.pdf \
            --poppler-text artifacts-resume.txt \
            --poppler-layout artifacts-resume-layout.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check PDF HTML accessibility
        run: |
          python -m http.server 8000 --directory _site >/tmp/resume-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 2
          npx --yes @axe-core/cli@4.11.0 \
            --exit \
            http://127.0.0.1:8000/resume-pdf.html

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install veraPDF
        run: |
          wget --quiet https://software.verapdf.org/releases/verapdf-installer.zip
          echo "6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838  verapdf-installer.zip" \
            | sha256sum --check --strict
          unzip -q verapdf-installer.zip
          java \
            -DINSTALL_PATH="${RUNNER_TEMP}/verapdf" \
            -jar verapdf-greenfield-1.30.2/verapdf-izpack-installer-1.30.2.jar \
            -options-system

      - name: Validate PDF/UA-1 conformance
        run: |
          "${RUNNER_TEMP}/verapdf/verapdf" \
            --flavour ua1 \
            --format raw \
            _site/assets/Dipak-Boyed-Resume.pdf \
            > artifacts-verapdf.xml
          grep -q 'isCompliant="true"' artifacts-verapdf.xml

      - name: Create artifact name
        id: artifact
        shell: bash
        run: |
          safe_ref=$(printf '%s' "${GITHUB_REF_NAME}" | tr '/\\:<>|*?' '-')
          echo "name=resume-${safe_ref}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload resume and validation reports
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            _site/assets/Dipak-Boyed-Resume.pdf
            artifacts-resume.txt
            artifacts-resume-layout.txt
            artifacts-verapdf.xml
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
